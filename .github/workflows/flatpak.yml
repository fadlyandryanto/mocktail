name: Flatpak

on:
  pull_request:
    paths:
      - '.github/workflows/flatpak.yml'
      - '.gitmodules'
      - 'CMakeLists.txt'
      - 'LICENSE'
      - 'assets/screenshots/**'
      - 'cmake/**'
      - 'config/**'
      - 'include/**'
      - 'packaging/flatpak/**'
      - 'packaging/discord-join.html'
      - 'packaging/icons/**'
      - 'packaging/space.bigrat.mocktail.desktop'
      - 'packaging/space.bigrat.mocktail.metainfo.xml'
      - 'packaging/space.bigrat.mocktail.svg'
      - 'scripts/assemble_flatpak_pages.sh'
      - 'scripts/assemble_native_repositories.sh'
      - 'site/**'
      - 'src/**'
      - 'stubs/**'
      - 'third_party/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: Flatpak build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      FLATPAK_ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Install Flatpak builder
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          git update-ref refs/heads/main "${{ github.sha }}"
          flatpak-builder \
            --arch="$FLATPAK_ARCH" \
            --jobs=4 \
            --user \
            --install-deps-from=flathub \
            --disable-rofiles-fuse \
            --force-clean \
            --default-branch=stable \
            --repo=repo \
            build-flatpak-ci \
            packaging/flatpak/space.bigrat.mocktail.json
          flatpak build-bundle \
            --arch="$FLATPAK_ARCH" \
            repo \
            "Mocktail-${FLATPAK_ARCH}.flatpak" \
            space.bigrat.mocktail \
            stable

      - name: Upload Flatpak
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Mocktail-${{ matrix.arch }}-flatpak
          path: Mocktail-${{ matrix.arch }}.flatpak
          if-no-files-found: error
          retention-days: 14